# `.dogfood.toml` — what the organizers' checker needs to know
#
# This file is read by `run.py`, the acceptance program the panel runs. It is
# six-to-fifteen lines by design: forty teams built forty different portals, and
# the answer to "how do we check a Django app and a Go app identically" is to
# let each one name its own routes.
#
# **The checker never logs in.** Logging in is the one thing no two stacks do
# alike — form posts, JSON posts, cookies, bearer tokens, OAuth — so instead of
# forcing a convention we hand over a header that proves the role and the
# checker attaches it. Our login page can work however it likes.
#
# Run it with:  python run.py .dogfood.toml
# Read the result with:  just accept

[portal]
base_url = "http://localhost:8080"

[tiers]
# Honest claims only, and they are checked against what the program can verify.
#
# **`claimed = ["T1", "T2"]`, decided at BREAK-2 on 2026-09-29** — the second
# scheduled verification break, against what was actually green, and not in
# advance. T1 was claimed at BREAK-1 on 2026-09-28 and is unchanged.
#
# T1 is earned because all three of its checks PASS, and — the part that decides
# it — they pass *for the right reason*. `run.py` accepts any 4xx for "closed
# event refuses submissions", so before FEAT-03 a 404, a 405, a CSRF rejection
# and a 401 for an unrecognised credential each reported PASS with the deadline
# never consulted (F-40). The acceptance gate now re-sends the checker's own
# request, with the same credential read out of the same file, and requires
# `assert_open_for_submission` in the response body. A wrong-reason refusal can no
# longer stand in for the guard, and an emptied [auth] block is caught before a
# request is sent.
#
# **T2 is claimed at BREAK-2 because all four of its checks PASS**, and — the part
# that decides it — each passes *with a precondition*, so a wrong-reason refusal
# cannot satisfy it. The judge console, the scoped score endpoint and the CSV
# export all shipped (FEAT-04, FEAT-05), and the peer-blindness check probes the
# checker's own URL with the checker's own credential and requires the refusal to
# NAME the guard that produced it. Without that precondition a 403 from CSRF
# would satisfy "the judge cannot see peer scores" and the check would be green
# for the wrong reason — the same shape as F-40, one layer down.
#
# **The gap is named in the same breath as the claim.** `run.py` prints `claimed`
# against `verified`, and `verified` is prefix-locked over
# ["T1","T2","T3","T4"], breaking at the first tier with no passing check. There
# are **no T3 or T4 checks in the organizers' program at all** — seven checks,
# three in T1 and four in T2 — so `verified T1 T2` is the CEILING a flawless
# build can reach, and the report below says exactly that (bible/03 §2). The
# ceiling is arithmetic, not a shortfall, and the report is generated and ships
# unedited rather than being adjusted to read better.
#
# The claim is made at a scheduled verification break, against what is actually
# green — not in advance, and not in a README.
claimed = ["T1", "T2"]
pitch = "Self-hostable hackathon submission and judging platform. One command, offline, no cloud."

[auth]
# Real values, printed by `docker compose logs portal` on every boot.
#
# The checker never logs in — logging in is the one thing no two stacks do
# alike — so it attaches whatever header we hand it. Ours is
# `Authorization: JJ1.<hmac>.<email>`: an HMAC-SHA256 over the identity, signed
# with a key that is **published in the repository**
# (`src/reviewer/accounts/demo_tokens.py`). That means anyone holding this repo
# can mint a token for any of the 121 fixture identities, which is why the
# README says in plain words that these are demo credentials and not secrets.
# It is a deliberate trade: a key derived from `SECRET_KEY` would be rotated by
# `down -v`, so this committed file would go stale on every reset and the
# participant probe would silently become an anonymous request — a false pass,
# which is the one outcome this project cannot afford.
#
# The seed prints the block below verbatim on every boot. `manage.py
# load_fixtures --quiet` prints just this, if you want it and nothing else.
#
# Every value here is asserted against the identities the seed promotes, by
# `tests/test_demo_credentials.py`. An emptied or hand-edited value fails the
# suite rather than the acceptance report.
organizer   = "Authorization: JJ1.d15bbfefced7cc79fdc3df06417be798.organizer@example.org"
judge_a     = "Authorization: JJ1.389ab67b635f718eb9dfda4690ce93ca.noor.haddad@example.org"
judge_b     = "Authorization: JJ1.7eadf0e2614a461c0bd456fe968abda3.kofi.mensah@example.org"
participant = "Authorization: JJ1.9705e9ffb45cbd9e082907afab26fa9d.priya1@example.org"

[routes]
# Our route names. Whatever we call them, we write them down.
#
# `gallery` and `submit` exist as of FEAT-03. The judge and export routes are
# declared ahead of FEAT-05 so the checker's failure message carries a real URL
# rather than a route the file never mentioned — and because a declared route
# that 404s is reported as FAIL with the URL in the message, which is more
# informative than silence.
#
# `peer_scores` is the URL that WOULD return judge_a's scores. The checker
# visits it as judge_b, who must be refused. In this portal it is a query
# parameter on the judge scores endpoint, and the refusal is a 403 from the
# permission layer — never a redirect, because the checker follows redirects
# and a 302 would come back as a 200.
#
# `submit` is a POST-capable endpoint that genuinely evaluates the deadline. It
# is **not** a GET-only form page: a 405 satisfies the checker's "any 4xx" for
# the wrong reason (bible/03 §4.4). Its refusal body names the guard that
# produced it — `assert_open_for_submission` — which is how a reader, a test and
# `tools/run_acceptance.py` can each tell a real deadline refusal from a CSRF
# rejection or a 404.
gallery      = "/"
submit       = "/projects/new"
judge_scores = "/api/v1/judge/scores"
peer_scores  = "/api/v1/judge/scores?judge=judge_a"
csv_export   = "/api/v1/export.csv"
