# Judge Judy — tooling configuration.
#
# This file configures ruff and pytest. It is not a build file and it is not
# installed into the container image; `.dockerignore` excludes it. The
# requirements are pinned in requirements.txt and requirements-dev.txt instead,
# so there is exactly one source of truth for versions and no resolver running
# at image-build time.

[tool.ruff]
# src/ holds the application, tests/ the suite, tools/ the gates. Including all
# three means the lint rule that forbids an unscoped Review queryset is checked
# against the test code too — a test that reaches for Review.objects.all()
# would be an unscoped path in a place nobody reviews.
src = ["src", "tests", "tools"]
line-length = 100
target-version = "py313"

# Django writes the migration files. `ruff format` would rewrite them on every
# run, which means the next `makemigrations` produces a diff, which means the
# migration history stops being a clean record of what the schema did and
# becomes a record of what a formatter felt like that week. A migration is
# generated, it is read by `migrate` and never by a human, and it is *not* to
# be hand-edited (coding-standards.md §4) -- so it is not to be machine-edited
# either.
#
# This exclusion is for STYLE ONLY, and that distinction is load-bearing:
#   * ruff does not see these files at all, so they get no E501/UP031/I001 pass.
#   * `tools/check_isolation.py` does NOT consult this file, so JJ01 still
#     scans migrations and would still catch an unscoped Review read written
#     into one.
# The real gate on migrations is `just lint-migrations`, which asserts
# `makemigrations --check` is clean: the schema and the migration cannot drift.
extend-exclude = [
    "src/reviewer/*/migrations",
    # The same reasoning as the per-file-ignores entry below, extended to the
    # FORMATTER. `ruff format` rewrites a file wholesale, which is a bigger
    # intervention than suppressing a lint code: the decision recorded against
    # tools/verify_spec.py is "do not machine-edit the gate that polices the
    # spec layer", and honouring it for `ruff check` while letting `ruff format`
    # rewrite the same file would be honouring it in name only.
    "tools/verify_spec.py",
]

[tool.ruff.lint]
# E   pycodestyle errors            — the boring correctness rules
# F   pyflakes                      — undefined names, unused imports
# I   isort                         — import order, which stops merge noise
# N   pep8-naming                   — Django's own conventions
# UP  pyupgrade                     — 3.13 syntax, no deprecated forms
# B   bugbear                       — the mutable-default and shadowing classes
# C4  comprehensions                — `[x for x in y]` where a generator reads better
# DJ  flake8-django                 — model-argument mistakes Django 5 deprecated
# S   bandit                        — hardcoded secrets, shell injection
# RUF ruff-specific                — the rules that catch our own mistakes
#
# DJ and S are the two that earn their place on a security-scored project:
# DJ catches the model-argument changes Django 5 deprecated, and S catches the
# hardcoded-secret and shell-injection classes a reviewer looks for first.
select = ["E", "F", "I", "N", "UP", "B", "C4", "DJ", "S", "RUF"]

ignore = [
    # The project has no module-level mutable state that is actually a bug, but
    # the Django app registry trips this on `AppConfig` defaults. Enabling it
    # properly needs the plugin's own config; leaving it out of the default set
    # is better than enabling it wrong.
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
# Tests build obviously-fake data on purpose. A password literal in a test is
# not a leaked credential, and a subprocess call in a test is not a shell
# injection. S101 (assert) and S603/S607 are noise in this directory.
"tests/**" = ["S101", "S105", "S106", "S603", "S607"]
# run.py is the organizers' file and is never modified, so linting it would
# create pressure to modify it. That would invalidate every result in
# acceptance-report.txt.
"run.py" = ["ALL"]
# The gates shell out to docker deliberately; that is their entire job.
"tools/docker.py" = ["S603", "S607"]
"tools/coldstart.py" = ["S603", "S607"]
"tools/prove_offline.py" = ["S603", "S607"]
"tools/run_acceptance.py" = ["S603", "S607"]
"tools/doctor.py" = ["S603", "S607"]

# tools/verify_spec.py was written BEFORE the window, in the spec layer, and is
# covered by its own 67-check gate plus a nine-mutation test. It is the one file
# in the repository that predates the coding standards it would now be judged
# against, and it carries 73 style findings (mostly E501 on its own banner
# strings and UP031 on its print formatting).
#
# It is excluded rather than mass-edited for one reason: it is the gate that
# polices the spec layer, and rewriting the gate while trusting the gate is not
# a risk worth taking for a cosmetic gain. The exclusion is narrow and named so
# it cannot become a dumping ground — if a new file wants to be exempt it has to
# be added here explicitly, in a diff a reviewer will see.
"tools/verify_spec.py" = ["E501", "UP031", "RUF005", "S603", "S607", "C401", "B007", "RUF059", "F841", "RUF001"]
[tool.ruff.lint.flake8-tidy-imports]
# The Django 5.2 + DRF idiom. `django.utils.timezone.utc` was removed and
# `timezone.utc` is not a public API; importing the documented replacement keeps
# a deprecation from becoming a runtime break in a decade-long fork.
ban-relative-imports = "parents"

[tool.pytest.ini_options]
# `src` on the path so `judge_judy` and `reviewer` import without an editable
# install. The alternative is a `pip install -e .` step in the test setup,
# which is a build step for a repository that promises none.
pythonpath = ["src"]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "judge_judy.settings"

# -q by default because the suite runs at every verification break, where a
# page of dots is noise. Failures still print in full.
#
# --strict-config turns an unknown key in this file into an error rather than a
# no-op. It is how `reuse_db` was caught sitting in the wrong table: pytest
# ignored it, so the database would have been silently reused between runs,
# making an ordering-dependent failure look intermittent.
addopts = "-q --strict-markers --strict-config"

markers = [
    # Traces a test to a demand ID from the specification, so a reviewer can go
    # from a test name to the requirement it defends. A test that cannot be
    # traced to a demand is either redundant or untraceable.
    "req(id): the requirement ID this test defends, e.g. req('T2-5')",
    # The isolation invariants. Property-based rather than example-based,
    # because the failure mode is "some combination we did not think of".
    "invariant: an isolation invariant proved over a generated space",
    # Needs the container. Excluded from the fast inner loop, and never
    # excluded from `just check`.
    "container: requires a running container",
]

filterwarnings = [
    # A warning that nobody reads is a warning nobody acts on. Turning them
    # into errors is the only way a deprecation gets fixed before it becomes a
    # runtime break in a fork that is meant to be maintained for a decade.
    "error",
    # Django emits this during static-file collection in tests, where the
    # manifest it refers to is legitimately absent.
    "ignore::django.utils.deprecation.RemovedInDjango60Warning",
]

# A fresh database per test, no --reuse-db. A shared database makes a failure
# depend on which tests ran before it, which is the property that makes a suite
# untrustworthy exactly when you need it. Declared under [tool.pytest_django]
# below, which is where pytest-django reads it.

[tool.pytest_django]
# The suite has to be able to create and destroy a database, so it gets its
# own. This is a file rather than `:memory:` because Django's migrations and
# the live server both behave differently on an in-memory database, and a suite
# that passes in memory and fails on disk is a suite that lies.
#
# `journal_mode` is left alone: in-memory SQLite cannot use WAL, and that is a
# property of `:memory:` rather than a defect. Testing against a real file is
# what makes the WAL settings in settings.py meaningful.
file = "data/test-db.sqlite3"
reuse_db = false
