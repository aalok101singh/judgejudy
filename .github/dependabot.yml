version: 2
updates:
  # Dependabot's default is one pull request per dependency. On a project this
  # small that is not a feature, it is a review-cost problem: a burst of unrelated
  # six-line diffs is enough to stop anyone reading a pull request properly, and
  # the security update nobody merged last month was probably in that burst. Each
  # update below is bundled into one pull request per ecosystem instead.
  - package-ecosystem: pip
    directory: /
    open-pull-requests-limit: 10
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Etc/UTC
    commit-message:
      prefix: "build(deps)"
    ignore:
      # **No major bumps, on purpose.**
      #
      # Dependabot's first run against this repository opened "bump django from
      # 5.2.17 to 6.1.1" -- which is the precise upgrade `requirements.txt`
      # argues against at length: the organizers intend to fork this and run it
      # for a decade, so the 5.2 LTS line is the right trade even though 6.1 is
      # the newer release. An automated pull request that contradicts a
      # documented decision gets declined by hand every time, and the one that
      # eventually gets merged by accident is the day the argument is lost.
      #
      # Patch and minor updates still arrive automatically. A major bump is a
      # decision, and a decision wants a person reading the changelog.
      #
      # Scoped to this ecosystem only: the GitHub Actions bumps below are wanted,
      # because the runner images deprecate the Node version older actions
      # target.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      python-dependencies:
        patterns:
          - "*"
        # Updates arrive together, get read together, and get reverted together.
        update-types:
          - minor
          - patch
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 10
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Etc/UTC
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - ci

  # requirements-dev.txt is read alongside requirements.txt by the pip ecosystem
  # above: Dependabot reads every requirements file it finds in the directory,
  # so test-only and runtime pins are grouped into the same pull request and
  # cannot be half-applied.