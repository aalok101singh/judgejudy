name: Bug report
description: Something in Judge Judy behaved differently from what it said it would do.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Judge Judy is an early project and issues are genuinely welcome, including
        the small ones — a confusing page, a message that did not say what it meant.

        Two things before you file:

        - **Security problems do not belong here.** A vulnerability, a broken
          isolation rule, an audit chain that can be rewritten, or anything that
          leaks one role's data to another: those go to `SECURITY.md`, not to a
          public issue. Read that page first.
        - **A refusal you think is wrong is a bug here.** If a page returned 403
          with an empty body and you expected a redirect, or the other way round,
          that is exactly the kind of report this project wants.

        If a number is involved — a count, a score, a hash, a timing — say how you
        got it. Several findings in this project came from re-running the tool that
        could tell the number instead of trusting a document.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The observed behaviour. Include the exact status code and body if it was a refusal — a bare 403 with an empty body is the designed behaviour in most places, so tell us what you saw rather than what you read.
      placeholder: |
        POST /api/v1/judge/scores as a second judge returned 403 with an empty
        body and no Location header. Expected...
    validations:
      required: true

  - type: textarea
    id: what-expected
    attributes:
      label: What you expected
      description: What the product promised, and where it said so. A README line, a page label, a rule of order.
      placeholder: The score endpoint is documented as "a judge's own scores, and nobody else's".
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: |
        The fastest path is `docker compose up`, then open the URL. If the bug
        needs a populated event, say whether it happens on a fresh empty database
        or only after `/setup/`, and whether `JJ_SEED_DEMO=1 docker compose up` is
        enough to see it. Steps that only work on your machine are worth much less
        than steps we can run cold.
      placeholder: |
        1. docker compose up
        2. open http://localhost:8080/setup/ and create an event
        3. sign in as judge A, open /judge/
        4. open the same URL as judge B in a private window
      render: text
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Which Judge Judy version, and how is it installed
      description: If you are on a fork, say so in the body — this project only supports what is in this repository.
      options:
        - docker compose (default)
        - pip install -r requirements.txt
        - other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Commit or version
      description: The short SHA from `git rev-parse --short HEAD`, or the container image tag.
      placeholder: a1b2c3d

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 / Ubuntu 24.04 / macOS 15
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      description: Only relevant if you are not on the container. The project targets 3.13 and the ambient system Python is not the one to use.
      placeholder: "3.13.13"
    validations:
      required: true

  - type: input
    id: docker
    attributes:
      label: Docker version
      description: From `docker --version`, or `just doctor` if that is easier.
      placeholder: "Docker version 29.6.2"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs, if you have them
      description: |
        `docker compose logs portal` is usually enough. `just doctor` tells you
        whether the toolchain itself is intact, which rules out a whole class of
        reports before we read them. Trim to the failing request if the boot log
        is long — the container prints row counts and census invariants on every
        boot, and none of that is usually the answer.
      render: text

  - type: checkboxes
    id: not-a-fork
    attributes:
      label: Before you submit
      options:
        - label: This is a bug in Judge Judy itself, not in a fork or a local modification.
          required: true