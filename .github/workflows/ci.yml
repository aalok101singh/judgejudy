name: CI

# Judge Judy proves claims rather than asserting them, so CI runs the SAME
# commands the project proves with -- via `just`, never a reimplementation.
#
# That constraint is the whole design here. An earlier version of this file
# would have been faster: it could have run `ruff` and `pytest` directly. But a
# copied gate is a gate that proves something *adjacent* to the thing, and the
# one defect class this project keeps re-learning is a check that passes while
# testing nothing. If a recipe in the justfile changes, this file needs no edit
# and cannot drift away from it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, because the two slow gates are the two that catch the defects a
  # fast suite cannot: a mutation nobody noticed, and a container that quietly
  # started reaching the network.
  schedule:
    - cron: "17 4 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"

jobs:
  # ---------------------------------------------------------------------
  # Fast gates. These three run on every push and finish in about two
  # minutes between them, which is the point: a contributor should learn that
  # they broke something before they have finished making coffee.
  # ---------------------------------------------------------------------

  spec:
    name: spec layer
    # **No install step, and that is deliberate.** verify_spec.py is stdlib
    # only: it needs no venv, no Django and no network. A gate that cannot be
    # broken by a dependency resolution failure is a gate that keeps working
    # when everything else is red.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: verify the spec layer
        run: python tools/verify_spec.py

  lint:
    name: lint + isolation rule
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m venv .venv
      - run: .venv/bin/pip install --upgrade pip -q
      - run: .venv/bin/pip install -q -r requirements-dev.txt
      - uses: extractions/setup-just@v4
      # ruff, ruff format, and the JJ01 rule that forbids an unscoped
      # `Review.objects` read. That third one is a real deliverable, not
      # hygiene: it is what turns "remember to scope this" into "there is no
      # code path that could leak".
      - run: just lint
      - name: migrations are in step with the models
        run: just lint-migrations

  test:
    name: test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m venv .venv
      - run: .venv/bin/pip install --upgrade pip -q
      - run: .venv/bin/pip install -q -r requirements-dev.txt
      - run: .venv/bin/python -m pytest -q

  # ---------------------------------------------------------------------
  # Diagnosis. Manual only, and it exists because guessing cost three
  # two-hour cycles.
  # ---------------------------------------------------------------------

  diagnose:
    name: why does the container gate not return?
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # **Manual only.** This is not a gate; it is the thing you run when the gate
    # is stuck.
    #
    # The container job hangs inside `docker compose up -d --wait`, and it has
    # now done so three times -- at 45, 75 and 120 minutes -- each time with the
    # container *listening* and then complete silence. Our own healthcheck
    # cannot be the cause: it has a 3-second deadline, catches every exception,
    # and always exits, so it cannot hang and cannot leave a container stuck in
    # "starting" for two hours. That leaves Compose's own wait behaviour, which
    # depends on the runner's Compose version rather than on anything in here.
    #
    # So this job deliberately does NOT use `--wait`. It brings the stack up the
    # boring way and then *reports the state*, on a bounded clock: the container
    # status, the health log, the healthcheck's own exit code and output, and the
    # last lines of the application log. Two minutes to a diagnosis instead of
    # two hours to a cancelled job that says nothing.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: extractions/setup-just@v4

      - name: versions
        run: |
          docker --version
          docker compose version
          python --version

      - name: bring the stack up the way the gate does, but bounded and loud
        run: |
          set -u
          # **`just check` itself, minus the rest.** This is the exact command
          # the gate runs, with the helper's own backstop. It is here because the
          # gate kept hanging inside `compose up` on this runner, and a
          # line-buffered, timeout-bounded version tells us in three minutes
          # which of the two candidate causes it is: the bring-up not returning,
          # or the health poll not seeing a healthy container.
          #
          # Nothing is captured, so anything the helper prints is visible while it
          # is happening rather than at the end.
          python tools/wait_healthy.py --seed-demo --up-timeout 240 --timeout 120
          echo "wait_healthy exit=$?"

  # ---------------------------------------------------------------------
  # The expensive gate. It needs a container, so it is split out to fail on
  # the slow thing without hiding the fast results -- and it is skipped on
  # pull requests, because the suite runs twice (host and image) and a
  # required check nobody waits for stops being read.
  # ---------------------------------------------------------------------

  container:
    name: container gate (run.py 7/7, offline, proofs)
    runs-on: ubuntu-latest
    # **Not on pull requests, and that is a decision rather than an omission.**
    # `just check` runs the full suite a second time inside the image -- which is
    # worth doing, because it is the only proof that what ships is what was
    # tested -- and on a shared runner that is the single most expensive thing
    # here. Measured: it consumed a 45-minute budget and then a 75-minute one.
    #
    # A required check nobody waits for is not a gate, it is a queue. So a
    # contributor's PR gets the fast jobs (spec, lint, test -- about ten
    # minutes) and the expensive gate runs on `main`, on the schedule, and on
    # demand. This mirrors how the project already treats `just check`: a
    # verification-break command, not a per-save one.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m venv .venv
      - run: .venv/bin/pip install --upgrade pip -q
      - run: .venv/bin/pip install -q -r requirements-dev.txt
      - uses: extractions/setup-just@v4

      # Build once, explicitly. `just check` builds again, but by then the layer
      # cache is warm and that build is nearly free.
      - name: build the image
        run: just build

      # THE GATE. Clean volume, network-independent build, up, the organizers'
      # checker (7 checks: 3x T1, 4x T2), the isolation proof, the census, the
      # assignment certificate, and the suite inside the image.
      #
      # Note it gates on the report BODY, not on run.py's exit code: run.py
      # returns 0 even when every check FAILs, so gating on its status would
      # report a green checkpoint for a completely broken portal.
      - name: just check
        run: just check

      # A committed artefact, so it is regenerated here and compared. If it
      # differs, the panel would score something other than what is committed.
      # This runs before prove-offline, while the portal from `just check` is
      # certainly still up.
      - name: the committed acceptance report is current
        run: |
          just report
          if ! git diff --exit-code -- acceptance-report.txt; then
            echo "::error::acceptance-report.txt is stale -- run 'just report' and commit it"
            exit 1
          fi

      # The claim that the container needs no network, proved rather than
      # asserted: the image is started with `--network none` and probed from
      # inside the same empty netns, including rendering the embeddable widget.
      - name: prove-offline
        run: just prove-offline

  coldstart:
    name: cold start (measurement, not a gate)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # **A measurement, deliberately not a required check.** It reports seconds
    # to a serving page against a 60 s budget, and the number in the README was
    # observed on specific hardware. A shared runner's figure is not comparable
    # to it, and gating on it would mean a red build that says something about
    # the runner rather than about the code -- a check that fails for a reason
    # nobody can act on. So it runs where a human is already looking.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m venv .venv
      - run: .venv/bin/pip install --upgrade pip -q
      - run: .venv/bin/pip install -q -r requirements-dev.txt
      - uses: extractions/setup-just@v2
      - name: cold start from an empty volume
        run: just coldstart

  mutation:
    name: mutation harness
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Deliberately NOT on every pull request. Each mutation is a full sandboxed
    # run of the gates, so this is the slowest job by an order of magnitude,
    # and a required check that takes 40 minutes trains people to ignore red.
    # It runs on main, on demand, and weekly -- which is where a mutation that
    # stopped being caught actually matters.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m venv .venv
      - run: .venv/bin/pip install --upgrade pip -q
      - run: .venv/bin/pip install -q -r requirements-dev.txt
      - uses: extractions/setup-just@v4
      # Corrupts every registered mutation on purpose and requires each one to
      # be caught by a named test. A mutation this harness can no longer APPLY
      # is reported separately from a real miss, because a silently-skipped
      # mutation and a passing gate look identical from outside.
      - run: just mutation-test